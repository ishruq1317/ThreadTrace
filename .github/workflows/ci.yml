name: ThreadTrace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit, slice, ArchUnit, and integration tests
        run: ./mvnw -B test
      - name: Package application artifact
        run: ./mvnw -B package -DskipTests
